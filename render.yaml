# DDUPaperHub — Render deployment manifest
#
# Database: Supabase (managed PostgreSQL). The backend connects to it via the
# connection string from Project Settings → Database → Connection string.
# All PDFs live in Cloudflare R2 (S3-compatible object storage).
#
# IMPORTANT — SECURITY:
# This file is committed to git. It must NEVER contain real secrets. The
# SUPABASE_DB_* and AWS_* values below are PLACEHOLDERS only. Before deploying,
# go to the Render dashboard → Environment and set the real values there.
# Render env vars override whatever is written here, so the app gets the real
# credentials and this file stays safe to commit.

services:
  # -------------------------------------------------------------
  # 1. Spring Boot Backend Service (Docker)
  # -------------------------------------------------------------
  - type: web
    name: ddu-paperhub-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: SUPABASE_DB_URL
        # HOST + PORT + DATABASE ONLY — never put user:password@ in the URL.
        # A password containing '@' breaks JDBC URL parsing and the app won't boot.
        # PLACEHOLDER — set the real value on the Render dashboard
        value: postgresql://db.example.supabase.co:5432/postgres
      - key: SUPABASE_DB_USERNAME
        # PLACEHOLDER — set the real value on the Render dashboard
        value: CHANGE-ME
      - key: SUPABASE_DB_PASSWORD
        # PLACEHOLDER — set the real value on the Render dashboard
        value: CHANGE-ME
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_TYPE
        value: s3
      - key: S3_BUCKET_NAME
        value: ddu-paperhub
      - key: AWS_REGION
        value: auto
      - key: S3_ENDPOINT
        value: https://7188cfbc71536983536d63f725bd336a.r2.cloudflarestorage.com
      - key: AWS_ACCESS_KEY_ID
        # PLACEHOLDER — set the real value on the Render dashboard
        value: CHANGE-ME
      - key: AWS_SECRET_ACCESS_KEY
        # PLACEHOLDER — set the real value on the Render dashboard
        value: CHANGE-ME
      - key: LOCAL_UPLOAD_DIR
        value: /app/uploads
      - key: CORS_ALLOWED_ORIGINS
        value: https://ddu-paperhub-frontend.onrender.com

  # -------------------------------------------------------------
  # 2. React Frontend Service (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: ddu-paperhub-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ddu-paperhub-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html