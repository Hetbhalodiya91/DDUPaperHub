services:
  # -------------------------------------------------------------
  # 1. Spring Boot Backend Service (Docker)
  # -------------------------------------------------------------
  - type: web
    name: ddu-paperhub-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: ddu-paperhub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ddu-paperhub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ddu-paperhub-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ddu-paperhub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ddu-paperhub-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_TYPE
        value: s3
      - key: S3_BUCKET_NAME
        value: ddu-paperhub
      - key: AWS_REGION
        value: auto
      - key: S3_ENDPOINT
        value: https://7188cfbc71536983536d63f725bd336a.r2.cloudflarestorage.com
      - key: AWS_ACCESS_KEY_ID
        value: a34ffc9c700824320fdfaddc54400f6c
      - key: AWS_SECRET_ACCESS_KEY
        value: f86a0a9a5f5d01aa6564491698a216cc8edd4ffa048d6f3741dd36ebe963459f
      - key: LOCAL_UPLOAD_DIR
        value: /app/uploads
      - key: CORS_ALLOWED_ORIGINS
        value: '*'

  # -------------------------------------------------------------
  # 2. React Frontend Service (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: ddu-paperhub-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ddu-paperhub-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ---------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ---------------------------------------------------------------
databases:
  - name: ddu-paperhub-db
    databaseName: ddu_paperhub
    user: ddu_admin
    plan: free
    region: oregon
