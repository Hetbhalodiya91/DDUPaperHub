services:
  # -------------------------------------------------------------
  # 1. Spring Boot Backend Service
  # -------------------------------------------------------------
  - type: web
    name: ddu-paperhub-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8081
      - key: DB_URL
        fromDatabase:
          name: ddu-paperhub-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: ddu-paperhub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ddu-paperhub-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_TYPE
        value: local
      - key: LOCAL_UPLOAD_DIR
        value: /app/uploads
      - key: CORS_ALLOWED_ORIGINS
        value: '*'

  # -------------------------------------------------------------
  # 2. React Frontend Service (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: ddu-paperhub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: singapore
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ---------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ---------------------------------------------------------------
databases:
  - name: ddu-paperhub-db
    databaseName: ddu_paperhub
    user: postgres
    plan: free
    region: singapore
