services:
  # -------------------------------------------------------------
  # 1. Spring Boot Backend Service (Docker)
  # -------------------------------------------------------------
  - type: web
    name: ddu-paperhub-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: ddu-paperhub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ddu-paperhub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ddu-paperhub-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ddu-paperhub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ddu-paperhub-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_TYPE
        value: local
      - key: LOCAL_UPLOAD_DIR
        value: /app/uploads
      - key: CORS_ALLOWED_ORIGINS
        value: '*'

  # -------------------------------------------------------------
  # 2. React Frontend Service (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: ddu-paperhub-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ---------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ---------------------------------------------------------------
databases:
  - name: ddu-paperhub-db
    databaseName: ddu_paperhub
    user: ddu_admin
    plan: free
    region: oregon
