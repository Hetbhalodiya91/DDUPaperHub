name: CI/CD Pipeline - Test and Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Automated Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        run: |
          cd backend
          mvn test -B -Dspring.profiles.active=h2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    name: Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated deployment..."
            
            # Navigate to project directory on server
            cd ~/DDUPaperHub || cd /var/www/DDUPaperHub
            
            # Fetch latest code
            git pull origin main
            
            # Rebuild and restart containers
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Clean up old unused docker images
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
