services:
  postgres:
    image: postgres:16-alpine
    container_name: ddu_paperhub_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ddu_paperhub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ddu_paperhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddu_paperhub_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ddu_paperhub}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8081
      STORAGE_TYPE: s3
      LOCAL_UPLOAD_DIR: /app/uploads
      S3_BUCKET_NAME: ddu-paperhub
      AWS_REGION: auto
      S3_ENDPOINT: https://7188cfbc71536983536d63f725bd336a.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: a34ffc9c700824320fdfaddc54400f6c
      AWS_SECRET_ACCESS_KEY: f86a0a9a5f5d01aa6564491698a216cc8edd4ffa048d6f3741dd36ebe963459f
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://yourdomain.com}
    ports:
      - "8081:8081"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ddu_paperhub_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads_data:
