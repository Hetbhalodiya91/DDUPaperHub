# DDUPaperHub — Production stack (own server)
#
# Database: Supabase (managed PostgreSQL). There is NO local database container
# here — the backend connects to Supabase over the network using the connection
# string from Project Settings → Database → Connection string.
#
# All PDFs live in Cloudflare R2 (S3-compatible object storage).
#
# Before starting, create .env with:
#   SUPABASE_DB_URL, SUPABASE_DB_USERNAME, SUPABASE_DB_PASSWORD, JWT_SECRET
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddu_paperhub_backend
    restart: always
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: supabase
      SERVER_PORT: 8081
      STORAGE_TYPE: s3
      LOCAL_UPLOAD_DIR: /app/uploads
      S3_BUCKET_NAME: ddu-paperhub
      AWS_REGION: auto
      S3_ENDPOINT: https://7188cfbc71536983536d63f725bd336a.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: a34ffc9c700824320fdfaddc54400f6c
      AWS_SECRET_ACCESS_KEY: f86a0a9a5f5d01aa6564491698a216cc8edd4ffa048d6f3741dd36ebe963459f
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://yourdomain.com}
    ports:
      - "8081:8081"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ddu_paperhub_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  uploads_data: