# Supabase profile — run with:
#   SPRING_PROFILES_ACTIVE=supabase   (or -Dspring.profiles.active=supabase)
#
# Supabase exposes a standard PostgreSQL instance. Wire it up with the host,
# port and database ONLY — never put the password inside the URL.
#
# TWO gotchas that make the app fail to boot:
#   1. The URL MUST start with "jdbc:" — the driver rejects a bare
#      "postgresql://" URL with "Driver ... claims to not accept jdbcUrl".
#   2. A password containing '@' (e.g. "Hetp@tel9126") breaks JDBC URL parsing
#      because the driver reads "user:password@host".
# So split it: URL = jdbc:postgresql://host:port/db, username/password separate.

spring:
  datasource:
    # HOST + PORT + DATABASE ONLY, with the "jdbc:" prefix. No user:password@.
    # e.g. jdbc:postgresql://db.cfviaihvvbbotyxrzytr.supabase.co:5432/postgres
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:${SERVER_PORT:8081}}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

logging:
  level:
    root: INFO
    com.ddu.paperhub: INFO
    org.springframework.web: WARN
    org.hibernate: ERROR