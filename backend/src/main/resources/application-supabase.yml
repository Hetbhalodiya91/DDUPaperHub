# Supabase profile — run with:
#   SPRING_PROFILES_ACTIVE=supabase   (or -Dspring.profiles.active=supabase)
#
# Supabase exposes a standard PostgreSQL instance. Wire it up with the host,
# port and database ONLY — never put the password inside the URL.
#
# WHY: a password containing '@' (e.g. "Hetp@tel9126") breaks JDBC URL parsing,
# because the driver reads "user:password@host". If you paste Supabase's full
# connection string into SUPABASE_DB_URL, the app fails to boot with:
#   Driver org.postgresql.Driver claims to not accept jdbcUrl, ...
# So split it: URL = host+port+db, username/password as separate fields.

spring:
  datasource:
    # HOST + PORT + DATABASE ONLY. No user:password@ prefix.
    # e.g. postgresql://db.cfviaihvvbbotyxrzytr.supabase.co:5432/postgres
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:${SERVER_PORT:8081}}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

logging:
  level:
    root: INFO
    com.ddu.paperhub: INFO
    org.springframework.web: WARN
    org.hibernate: ERROR