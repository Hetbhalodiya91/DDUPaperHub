# Supabase profile — run with:
#   SPRING_PROFILES_ACTIVE=supabase   (or -Dspring.profiles.active=supabase)
#
# Supabase exposes a standard PostgreSQL instance. The connection string it
# gives you (Project Settings → Database → Connection string) is the simplest
# way to wire it up. Either pass the full string or the individual parts.

spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:${SERVER_PORT:8081}}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

logging:
  level:
    root: INFO
    com.ddu.paperhub: INFO
    org.springframework.web: WARN
    org.hibernate: ERROR