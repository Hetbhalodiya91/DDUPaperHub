# Local dev stack that talks to Supabase instead of a local Postgres.
#
# Supabase is a managed PostgreSQL, so there is no database container here —
# the backend just connects over the network using the connection string
# Supabase gives you (Project Settings → Database → Connection string).
#
# Copy this file to docker-compose.yml (or run with -f) and create .env:
#
#   cp .env.example .env
#   # fill in SUPABASE_DB_URL / SUPABASE_DB_USERNAME / SUPABASE_DB_PASSWORD
#
#   docker compose -f docker-compose.supabase.yml up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddu_paperhub_backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: supabase
      SERVER_PORT: 8081
      STORAGE_TYPE: s3
      LOCAL_UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost,https://ddu-paperhub-frontend.onrender.com
    ports:
      - "8081:8081"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ddu_paperhub_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      VITE_API_BASE_URL: https://ddu-paperhub-backend.onrender.com
    ports:
      - "5173:80"

volumes:
  uploads_data: